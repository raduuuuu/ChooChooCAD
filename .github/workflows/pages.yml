# Publish the built app to GitHub Pages at woodentrain.world.
#
# The app is a static SPA with no backend and no network calls of any kind, so
# "deploy" is literally: build, upload `app/dist`, serve it. 372 KB.
#
# THE GATE IS ci.yml ITSELF, called as a reusable workflow. This file used to
# repeat ci.yml's install, typecheck, test and build steps, and the copy
# drifted: it never pinned Node, so the suite ran on the runner's default and a
# spec that passes in ~7s under the pinned Node timed out at 17.4s. The deploys
# of PR #40 and #41 failed while CI stayed green, and the site sat on PR #39.
# Calling ci.yml means there is one list of steps and one set of pins, and the
# artifact published is the one that run built and tested.
#
# The CNAME file lives in `app/public/` rather than being set only in the Pages
# settings, so the custom domain survives a redeploy and is visible in the repo
# instead of hiding in a web form.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these; the gate job does not. Scoped per job below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    # Publishing an app whose tests have not run is how a broken build reaches
    # a real URL. The same workflow every push runs, plus the artifact upload.
    uses: ./.github/workflows/ci.yml
    with:
      publish: true

  deploy:
    needs: gate
    # ONLY FROM main, and the guard is the point.
    #
    # `on:` restricts the PUSH trigger to main, but `workflow_dispatch` has no
    # such restriction, so before this line a manual dispatch from any branch
    # ran the gate, uploaded that branch's artifact and published it to the
    # live site. Nothing announced that; the deploy job simply followed the
    # gate wherever it ran.
    #
    # With the guard, dispatching this workflow on a branch runs the gate and
    # stops. That is what makes the gate usable as pre-merge evidence: it can
    # now prove the tests on linux for a branch WITHOUT the proof costing a
    # deployment. `/ship` derives its remote-lane obligations from these
    # workflow files mechanically and cannot tell a main-only job from any
    # other, so before this the obligation was unsatisfiable on a branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
