# Something re-runs the tests after the session that wrote them.
#
# WHY THIS FILE EXISTS (task X1b)
#
# This project spent roughly two human days writing tests whose entire value is
# regression protection, in a repository where nothing re-ran them. Every
# verification step in six review passes said "manual and one-time by
# construction" for that reason. X1b was priced at one hour against a phase of
# test work, and declining it is the mechanism by which a P1 risk survives six
# months.
#
# It was blocked on there being a remote at all, which X1 created the same day.
#
# WHAT GREEN LOOKS LIKE, and why there are no numbers here any more.
#
# This header carried exact baselines so a red run was distinguishable from a
# pre-existing failure. They went stale FOUR times in two days: 17 files / 261
# tests, then 18 / 302, then 19 / 333, then 19 / 375, each one re-measured in
# the same breath as a warning that a baseline nobody re-measures is worse than
# none. The warning was right and the mechanism was wrong: a number pasted into
# a comment has no gate, so it rots silently while everything around it is
# pinned by a test.
#
# So the numbers live where they can fail:
#
#   bun run test        the suite pins itself. A storage-key rename, a slop
#                       ceiling, a dropped guard -- each has a test that goes
#                       red, which is what a baseline was trying to approximate.
#   bun run typecheck   exit 0, no diagnostics, under noUnusedLocals.
#   bun run build       vite build green.
#
# NOTHING is skipped. It was four specs pinning two P0s, then two pinning one,
# and now zero. Both P0s -- a recovered layout manufacturing a false "can't be
# built", and the cycle enumeration's cost at the accepted rank ceiling -- are
# fixed, so all four specs run normally. That is what closing one of these
# looks like: the skip count goes DOWN and the specs stay.
#
# A skip that reappears is the thing to look at. `it.skip` in this repo means a
# known-failing pin, never a quarantined flake.
#
# All three run as declared package scripts, never inlined here, so CI and a
# person at a keyboard invoke the same command. That is E15's point: an inlined
# `bun x tsc --noEmit` drifts from what anyone actually types.

name: CI

on:
  push:
  pull_request:
  # Pages calls this workflow as its gate (pages.yml), so the deploy runs the
  # SAME pinned steps rather than a copy of them. The copy drifted: it never
  # pinned Node, ran the suite on the runner's default, and a state-walk spec
  # that takes ~7s here took 17.4s there and timed out, failing the deploys of
  # PR #40 and #41 while this workflow stayed green (found 2026-10-23).
  workflow_call:
    inputs:
      publish:
        description: Upload app/dist as the Pages artifact after a green build.
        type: boolean
        default: false

# A second push to the same branch makes the first run pointless. The
# workflow name is in the group so the Pages gate (which runs this file under
# the name "Pages") never cancels, or is cancelled by, the push run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # PINNED, not ubuntu-latest. GitHub migrates that label to Ubuntu 26 from
    # 2026-10-19, five days after this file was written, and a runner image
    # changing under the build is the same class of silent move as an unpinned
    # bun: it can change a result without anyone deciding to. Raise it
    # deliberately, the way the bun pin below is raised.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not "latest". The engine's exactness is the product, and a
          # silent runtime bump is the kind of thing that moves a verdict
          # without anyone deciding to. Raise it deliberately.
          bun-version: 1.3.14

      # Pinned too, and newly needed (task E11). `bun run test` runs vitest
      # under Node, not bun, and until now that was whatever the runner image
      # shipped. jsdom 30, which the `dom` test project uses, requires Node
      # 22.22+, 24.15+ or 26+. 26.7.0 is the version the suite was written and
      # measured on, including the Web Storage shadowing app/test/domSetup.ts
      # works around.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      # --frozen-lockfile so CI fails on a lockfile that disagrees with
      # package.json rather than quietly resolving something else.
      - name: Install
        run: bun install --frozen-lockfile

      # Ordered cheapest-signal-first: types before tests before the bundle.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The editor stays small and Three.js stays in the lazy chunk (3D plan, eng D11).
      - name: Chunk budget
        run: bun scripts/chunkBudget.ts

      # Only when Pages asked for it: the artifact the deploy job publishes is
      # the one this exact run built and tested.
      - name: Upload Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
