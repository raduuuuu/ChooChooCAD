# Dependency updates (repo-checkups plan, T1): once a month, one grouped pull
# request per ecosystem, so updates arrive as two reviews, not a stream.
# `bun` reads the text bun.lock (Dependabot, GA 2025-02); security alerts are
# on in the repository's settings.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    # TypeScript 7 offers its compiler API only as "unstable" (typescript/unstable/*),
    # and five tests read source with that API (storage.guard, sources, levelAccess,
    # view3dImports, copyPosition). Stay on 5.x until it is stable (owner, 2026-11-09).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
