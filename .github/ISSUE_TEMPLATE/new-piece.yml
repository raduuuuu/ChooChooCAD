# A track piece the library is missing (community-pieces plan,
# docs/plan/2026-11-08-community-pieces.md: CEO D1, design D10, eng D8).
# Order: checklist, photos, words, markings, checkboxes (design D10).
# The label names come from .github/piece-labels.json (eng D3); a test keeps them in step.
name: New piece
description: Send photos of a track piece the app doesn't have yet, so it can be drawn.
title: "Piece: "
labels: ["piece: waiting"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you take any photos**, have these ready (the [photo guide](https://woodentrain.world/photo-guide.html) shows each step):

        1. **Turn off location for your camera**, or remove it from each photo afterwards ([how, for each phone and computer](https://github.com/raduuuuu/ChooChooCAD/blob/main/CONTRIBUTING.md#remove-where-a-photo-was-taken)). Photos posted here are public, and GitHub keeps them online even if the issue is deleted later.
        2. The piece, and one **medium straight** (144 mm) to lie beside it as the ruler. For your first piece, also a **long straight** (216 mm).
        3. A sheet of white, blue or pink millimetre or graph paper, laid flat (not cream or yellow: the wood can't be told from it).
        4. The top view twice, moving the pieces between, and one photo of the underside. No side or end photos unless someone asks.
        5. Nothing else in the frame: no people, faces, house numbers, letters or screens.
  - type: upload
    id: photos
    attributes:
      label: Photos
      description: "The top view twice and the underside. On your first piece, two photos of the long straight too. Side or end photos only if someone asks."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is the piece?
      description: In your own words, what it is and what it does.
    validations:
      required: true
  - type: textarea
    id: joins
    attributes:
      label: Which pieces does it join?
      description: Optional. For example, "the usual wooden track" or "only its own set".
    validations:
      required: false
  - type: input
    id: markings
    attributes:
      label: Markings
      description: Anything printed or moulded on the underside, and where and roughly when you bought it. Versions of the same piece can differ.
    validations:
      required: true
  - type: dropdown
    id: reference
    attributes:
      label: Do you have a medium (144 mm) and a long (216 mm) straight?
      description: If not, send what you have; someone will ask for what's missing.
      options:
        - "Yes, both"
        - "Only the medium straight"
        - "Neither"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I removed where each photo was taken (location data), or my camera's location was off.
          required: true
        - label: No people, faces, addresses, letters or screens are in the photos.
          required: true
        - label: I took these photos and license them under this repository's licence (MIT).
          required: true
